<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/favicon-32.png"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <meta name="theme-color" content="#2a2633" />

    <!-- Primary meta -->
    <title>
      Sébastien Fabié — Développeur web fullstack à Annecy
    </title>
    <meta
      name="description"
      content="Développeur web fullstack orienté backend à Annecy. Node.js, TypeScript, PostgreSQL. Des sites et des API solides, pensés pour durer. CDI ou freelance."
    />
    <link rel="canonical" href="https://sebastienfabie.fr/" />

    <!-- Données structurées (Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://sebastienfabie.fr/#person",
            "name": "Sébastien Fabié",
            "url": "https://sebastienfabie.fr/",
            "jobTitle": "Développeur web fullstack",
            "description": "Développeur web fullstack à Annecy, orienté backend : Node.js, TypeScript, PostgreSQL. Disponible en CDI ou freelance.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Annecy",
              "addressRegion": "Haute-Savoie",
              "addressCountry": "FR"
            },
            "knowsAbout": [
              "Node.js",
              "TypeScript",
              "PostgreSQL",
              "Express",
              "NestJS",
              "Docker",
              "React",
              "Développement backend",
              "API REST"
            ],
            "alumniOf": [
              { "@type": "EducationalOrganization", "name": "École O'clock" },
              {
                "@type": "CollegeOrUniversity",
                "name": "Université Savoie Mont Blanc"
              }
            ],
            "sameAs": [
              "https://www.linkedin.com/in/sebastienfabie/",
              "https://github.com/Sebvietsky"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://sebastienfabie.fr/#website",
            "url": "https://sebastienfabie.fr/",
            "name": "Sébastien Fabié",
            "inLanguage": "fr-FR",
            "author": { "@id": "https://sebastienfabie.fr/#person" }
          }
        ]
      }
    </script>

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://sebastienfabie.fr/" />
    <meta
      property="og:title"
      content="Sébastien Fabié — Développeur web fullstack à Annecy"
    />
    <meta
      property="og:description"
      content="Développeur web fullstack orienté backend à Annecy. Node.js, TypeScript, PostgreSQL. Des sites et des API solides, pensés pour durer. CDI ou freelance."
    />
    <meta
      property="og:image"
      content="https://sebastienfabie.fr/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Carte de visite de Sébastien Fabié, développeur fullstack."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sébastien Fabié — Développeur web fullstack à Annecy"
    />
    <meta
      name="twitter:description"
      content="Développeur web fullstack orienté backend à Annecy. Node.js, TypeScript, PostgreSQL. Des sites et des API solides, pensés pour durer. CDI ou freelance."
    />
    <meta
      name="twitter:image"
      content="https://sebastienfabie.fr/og-image.png"
    />

    <!-- Theme anti-flash : appliqué AVANT le rendu pour éviter le flash visuel -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Statistiques de visite (GoatCounter, sans cookies) -->
    <script
      data-goatcounter="https://sebastienfabie.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
